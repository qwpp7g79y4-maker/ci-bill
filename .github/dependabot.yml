version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/fuzz"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The ref of this action is the Rust toolchain itself (1.85 is the MSRV job).
      - dependency-name: "dtolnay/rust-toolchain"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
