[package]
name = "ci-bill"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["PEPAI <pep_ai@icloud.com>"]
description = "Rank GitHub Actions cost per workflow from the billing usage CSV and point to likely causes"
repository = "https://github.com/qwpp7g79y4-maker/ci-bill"
readme = "README.md"
keywords = ["github-actions", "ci", "cost", "billing", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github/", "/.gitattributes", "/fuzz/", "/prive/"]

[lib]
name = "ci_bill"
path = "src/lib.rs"

[[bin]]
name = "ci-bill"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde_json = "1.0"
yaml-rust2 = "=0.13.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }
