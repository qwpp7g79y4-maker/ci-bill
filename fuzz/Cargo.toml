[package]
name = "ci-bill-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"

[dependencies.ci-bill]
path = ".."

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "usage_csv"
path = "fuzz_targets/usage_csv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workflow_yaml"
path = "fuzz_targets/workflow_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_json"
path = "fuzz_targets/api_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "price_files"
path = "fuzz_targets/price_files.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_render"
path = "fuzz_targets/json_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fix_diff"
path = "fuzz_targets/fix_diff.rs"
test = false
doc = false
bench = false
